[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
common = {path = "../common"}
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4.42"
anyhow = "1.0.100"
tower = "0.5.2"
tower-http = { version = "0.6.7", features = ["trace"] }
