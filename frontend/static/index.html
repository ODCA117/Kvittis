<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvittis - Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>Kvittis</h1>
            <div id="auth-status" class="auth-status"></div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Login/Register Section -->
            <section id="auth-section" class="section">
                <h2>Welcome to Kvittis</h2>
                <p>Track shared expenses with friends and groups</p>

                <div class="auth-forms">
                    <!-- Login Form -->
                    <div class="card">
                        <h3>Login</h3>
                        <form id="login-form" class="form">
                            <div class="form-group">
                                <label for="login-username">Username</label>
                                <input type="text" id="login-username" required>
                            </div>
                            <div class="form-group">
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Login</button>
                        </form>
                        <p id="login-error" class="error-message"></p>
                    </div>

                    <!-- Register Form -->
                    <div class="card">
                        <h3>Register</h3>
                        <form id="register-form" class="form">
                            <div class="form-group">
                                <label for="register-username">Username</label>
                                <input type="text" id="register-username" required>
                            </div>
                            <div class="form-group">
                                <label for="register-email">Email</label>
                                <input type="email" id="register-email" required>
                            </div>
                            <div class="form-group">
                                <label for="register-password">Password</label>
                                <input type="password" id="register-password" required>
                            </div>
                            <button type="submit" class="btn btn-secondary">Register</button>
                        </form>
                        <p id="register-error" class="error-message"></p>
                    </div>
                </div>
            </section>

            <!-- Dashboard Section (shown when logged in) -->
            <section id="dashboard-section" class="section hidden">
                <div class="dashboard-layout">
                    <!-- User Info -->
                    <div class="card user-info">
                        <h3>Your Account</h3>
                        <p id="user-username"></p>
                        <p id="user-email"></p>
                        <button id="logout-btn" class="btn btn-danger">Logout</button>
                    </div>

                    <!-- Net Balance -->
                    <div class="card balance-card">
                        <h3>Your Net Balance</h3>
                        <div id="net-balance" class="net-balance">
                            <span class="balance-amount">$0.00</span>
                            <span class="balance-label"></span>
                        </div>
                    </div>
                </div>

                <!-- Balances Table -->
                <div class="card">
                    <h3>Your Balances</h3>
                    <p class="subtitle">Who owes you and who you owe</p>
                    <table id="balances-table" class="data-table">
                        <thead>
                            <tr>
                                <th>Friend</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="balances-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Create Expense Form -->
                <div class="card">
                    <h3>Add Expense</h3>
                    <form id="expense-form" class="form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expense-amount">Amount ($)</label>
                                <input type="number" id="expense-amount" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label for="expense-payer">Payer</label>
                                <select id="expense-payer" required>
                                    <option value="">Select payer...</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="expense-description">Description</label>
                            <input type="text" id="expense-description" placeholder="Pizza night">
                        </div>
                        <div class="form-group">
                            <label for="expense-participants">Participants (comma separated usernames)</label>
                            <input type="text" id="expense-participants" placeholder="alice,bob,charlie" required>
                        </div>
                        <div class="form-group">
                            <label for="expense-group">Group (optional)</label>
                            <select id="expense-group">
                                <option value="">No group</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Expense</button>
                    </form>
                    <p id="expense-error" class="error-message"></p>
                    <p id="expense-success" class="success-message"></p>
                </div>

                <!-- Recent Expenses -->
                <div class="card">
                    <h3>Recent Expenses</h3>
                    <table id="expenses-table" class="data-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Payer</th>
                                <th>Participants</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Groups Section -->
            <section id="groups-section" class="section hidden">
                <div class="card">
                    <h3>Your Groups</h3>
                    <button id="create-group-btn" class="btn btn-secondary">Create Group</button>
                    <div id="groups-list" class="groups-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
